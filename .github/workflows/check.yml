name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Bind checked-out source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code HEAD
          printf 'checked-out SHA: %s\n' "$(git rev-parse HEAD)"
          python --version
          node --version
      - name: Install pinned checkers
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Full Python discovery, no skips, source-bound imports
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import unittest

          root = pathlib.Path.cwd().resolve()
          if sys.version_info[:2] != (3, 11):
              raise SystemExit('Python 3.11 required')
          program = unittest.TestProgram(
              module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'], exit=False
          )
          result = program.result
          print(f'Python: tests={result.testsRun} skips={len(result.skipped)}', flush=True)
          if (result.testsRun < 62 or not result.wasSuccessful() or result.skipped
                  or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit('Python count/result/skip gate failed')
          tracked = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          for name in tracked:
              path = pathlib.Path(name)
              if path.suffix != '.py' or path.parts[0] not in ('agent_household', 'tests'):
                  continue
              module_name = (path.stem if path.parts[0] == 'tests' else
                             '.'.join(path.with_suffix('').parts))
              if module_name.endswith('.__init__'):
                  module_name = module_name.removesuffix('.__init__')
              module = sys.modules.get(module_name)
              actual = pathlib.Path(getattr(module, '__file__', '')).resolve()
              print(f'import {module_name}: {actual}', flush=True)
              if actual != root / path or not actual.is_file():
                  raise SystemExit(f'Unchecked or external Python source: {name}')
          PY
      - name: Strict Ruff lint and format
        run: |
          ruff --version
          ruff check --config pyproject.toml agent_household tests
          ruff format --check --config pyproject.toml agent_household tests
      - name: Strict Basedpyright, positive analyzer coverage
        timeout-minutes: 3
        run: |
          basedpyright --version
          python - <<'PY'
          import json
          import subprocess

          run = subprocess.run(
              ['basedpyright', '--project', 'pyproject.toml', '--outputjson'],
              capture_output=True, text=True, timeout=150
          )
          print(run.stdout, flush=True)
          print(run.stderr, flush=True)
          if run.returncode != 0:
              raise SystemExit(run.returncode)
          summary = json.loads(run.stdout)['summary']
          count = summary['filesAnalyzed']
          print(f'Actual analyzer files: {count}', flush=True)
          if (type(count) is not int or count <= 0 or summary['errorCount'] != 0
                  or summary['warningCount'] != 0):
              raise SystemExit('Typecheck coverage/diagnostic gate failed')
          PY
      - name: Node 22 syntax and full tests, no skipped or todo
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess

          version = subprocess.check_output(['node', '--version'], text=True).strip()
          if not version.startswith('v22.'):
              raise SystemExit('Node 22 required')
          tracked = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          sources = [name for name in tracked if pathlib.Path(name).suffix in ('.js', '.mjs', '.cjs')]
          if not sources:
              raise SystemExit('Zero JavaScript sources')
          for name in sources:
              print(f'Node syntax: {pathlib.Path(name).resolve()}', flush=True)
              subprocess.run(['node', '--check', name], check=True, timeout=30)
          # Node's default discovery does not include this repository's test_*.mjs names.
          tests = [name for name in sources if
                   re.search(r'(^test[_-]|[._-](test|spec)\.(js|mjs|cjs)$)', pathlib.Path(name).name)
                   or 'test' in pathlib.Path(name).parts[:-1]]
          if not tests:
              raise SystemExit('Zero JavaScript test files')
          print(f'Node test files: {tests}', flush=True)
          run = subprocess.run(
              ['node', '--test', '--test-reporter=tap', *tests],
              capture_output=True, text=True, timeout=150
          )
          print(run.stdout, flush=True)
          print(run.stderr, flush=True)
          if run.returncode != 0:
              raise SystemExit(run.returncode)
          counts = {}
          for key in ('tests', 'pass', 'fail', 'cancelled', 'skipped', 'todo'):
              matches = re.findall(rf'^# {key} (\d+)$', run.stdout, re.MULTILINE)
              if len(matches) != 1:
                  raise SystemExit(f'Missing/ambiguous TAP summary: {key}')
              counts[key] = int(matches[0])
          print(f'Node counts: {counts}', flush=True)
          if (counts['tests'] < 17 or counts['pass'] != counts['tests']
                  or any(counts[key] for key in ('fail', 'cancelled', 'skipped', 'todo'))):
              raise SystemExit('Node count/result/skip/todo gate failed')
          PY
      - name: Confirm source stayed unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code HEAD
